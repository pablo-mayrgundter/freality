<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADF dental scan</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1c1f; color: #eee; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
      #c { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
      #hud {
        position: absolute; left: 16px; top: 16px; z-index: 2;
        background: rgba(18, 20, 24, 0.82); padding: 12px 14px; border-radius: 10px;
        max-width: 320px; backdrop-filter: blur(8px);
      }
      #hud h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
      #hud p { margin: 0 0 8px; color: #c8ccd2; }
      #hud label { display: flex; gap: 8px; align-items: center; margin: 4px 0; cursor: pointer; }
      #status { color: #9ad; }
      #drop {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        border: 2px dashed #556; margin: 48px; border-radius: 16px; color: #aaa; z-index: 1;
      }
      #drop.visible { display: flex; }
      button, input[type='file'] { font: inherit; }
      button {
        background: #2e6bff; color: white; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>Align ADF viewer</h1>
      <p id="status">Load the sample scan, or open one of your own.</p>
      <p><button id="sample">Load sample scan (PM.adf, 1.8 MB)</button></p>
      <label><input type="checkbox" id="tog-upper" checked /> Upper jaw</label>
      <label><input type="checkbox" id="tog-lower" checked /> Lower jaw</label>
      <label><input type="checkbox" id="tog-facc" checked /> FACC curves</label>
      <label><input type="checkbox" id="tog-gingiva" /> Gingiva splines</label>
      <label><input type="checkbox" id="tog-scan" /> Scan sample points</label>
      <p style="margin-top:10px">
        <input type="file" id="file" accept=".adf" /> <span style="color:#888">or drag-drop</span>
      </p>
    </div>
    <div id="drop">Drop a .adf file here</div>
    <canvas id="c"></canvas>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
